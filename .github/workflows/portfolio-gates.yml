name: Portfolio release matrix
on:
  pull_request:
    paths:
      - "release/**"
      - "infra/local-runner/**"
      - ".github/workflows/**"
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"
  push:
    branches: [main]
    paths:
      - "release/**"
      - "infra/local-runner/**"
      - ".github/workflows/**"
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s release -p 'test_*.py' -v
      - run: python -m unittest discover -s infra/local-runner -p 'test_*.py' -v
      - run: python release/check_portfolio.py release/portfolio-gates-current.json
