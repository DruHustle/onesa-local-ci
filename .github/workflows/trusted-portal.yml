name: Trusted local Portal checks
run-name: Portal ${{ inputs.source_sha }} (local=${{ inputs.run_local }})
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed commit at the tip of public Portal main
        required: true
        type: string
      run_local:
        description: Run source checks on the registered local ARM64 host
        type: boolean
        default: false
permissions: {}
concurrency:
  group: trusted-local-portal
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify controller and reviewed public source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          OWNER: ${{ github.repository_owner }}
          VISIBILITY: ${{ github.event.repository.visibility }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == DruHustle/onesa-local-ci && "$GITHUB_REF" == refs/heads/main ]]
          [[ "$REPOSITORY_PRIVATE" == true && "$OWNER" == DruHustle && "$GITHUB_ACTOR" == "$OWNER" && "$TRIGGERING_ACTOR" == "$OWNER" ]]
          [[ -z "$VISIBILITY" || "$VISIBILITY" == private ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual=$(git ls-remote --exit-code https://github.com/DruHustle/onesa-company-portal.git refs/heads/main | cut -f1)
          [[ "$actual" == "$SOURCE_SHA" ]]
          printf 'Verified Portal main `%s`.\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
  local:
    needs: preflight
    if: ${{ inputs.run_local }}
    runs-on: [self-hosted, Linux, ARM64, onesa-portal-local]
    timeout-minutes: 10
    outputs:
      tested_sha: ${{ steps.checks.outputs.tested_sha }}
    steps:
      - name: Check documentation and system appearance on trusted Portal main
        id: checks
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == self-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == ARM64 ]]
          [[ $(uname -m) == aarch64 && $(id -un) == onesa-ci ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          scratch=$(mktemp -d "$RUNNER_TEMP/portal.XXXXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          mkdir "$scratch/home"
          git -c core.hooksPath=/dev/null init -q "$scratch/source"
          cd "$scratch/source"
          git -c credential.helper= -c core.hooksPath=/dev/null fetch --quiet --no-tags --depth=1 https://github.com/DruHustle/onesa-company-portal.git refs/heads/main
          [[ $(git rev-parse FETCH_HEAD) == "$SOURCE_SHA" ]]
          git -c core.hooksPath=/dev/null checkout --quiet --detach "$SOURCE_SHA"
          clean_env=(env -i "HOME=$scratch/home" PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8)
          "${clean_env[@]}" python3 scripts/validate-docs.py
          "${clean_env[@]}" onesa-ci-node --test scripts/test_system_appearance.mjs
          printf 'tested_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
  hosted-verification:
    needs: [preflight, local]
    if: ${{ always() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
          token: ''
      - name: Independently check the exact public source on GitHub
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
          REQUESTED_LOCAL: ${{ inputs.run_local }}
          LOCAL_RESULT: ${{ needs.local.result }}
          LOCAL_SHA: ${{ needs.local.outputs.tested_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git -c core.hooksPath=/dev/null init -q "$RUNNER_TEMP/portal-hosted"
          cd "$RUNNER_TEMP/portal-hosted"
          git -c credential.helper= fetch --quiet --no-tags --depth=1 https://github.com/DruHustle/onesa-company-portal.git "$EXPECTED_SHA"
          [[ $(git rev-parse FETCH_HEAD) == "$EXPECTED_SHA" ]]
          git -c core.hooksPath=/dev/null checkout --quiet --detach "$EXPECTED_SHA"
          python3 scripts/validate-docs.py
          node --test scripts/test_system_appearance.mjs
          printf 'GitHub-hosted Portal documentation and appearance checks passed at `%s`.\n' "$EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$REQUESTED_LOCAL" == true ]]; then
            printf 'The local ARM64 job finished with **%s**.\n' "$LOCAL_RESULT" >> "$GITHUB_STEP_SUMMARY"
            [[ "$LOCAL_RESULT" == success && "$LOCAL_SHA" == "$EXPECTED_SHA" ]]
          else
            printf 'Hosted-only run. Local verification was not requested.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
